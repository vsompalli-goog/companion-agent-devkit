[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-companion-agent-devkit"
version = "0.1.0"
description = "Agent Assist Companion Agent DevKit (aa-dev-kit): Best-practice skills pack (L1) and stateless config export & review CLI (L2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.20.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
aa-devkit = "aa_devkit.main:main"

[tool.setuptools.packages.find]
where = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cli"]
